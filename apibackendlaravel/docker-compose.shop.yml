services:
  shop-postgres:
    image: postgres:latest
    container_name: shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shop_db
      POSTGRES_USER: shop_user
      POSTGRES_PASSWORD: IamJeentan1
    ports:
      - "5433:5432"
    volumes:
      - shop_postgres_data:/var/lib/postgresql

  shop-redis:
    image: redis:latest
    container_name: shop-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - shop_redis_data:/data

volumes:
  shop_postgres_data:
  shop_redis_data: